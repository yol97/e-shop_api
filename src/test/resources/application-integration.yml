spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

  sql:
    init:
      mode: never

jwt:
  # ✅ fallback dummy (pas un vrai secret) : permet de démarrer partout
  secret: ${JWT_SECRET:01234567890123456789012345678901}
  expiration: ${JWT_EXPIRATION_MS:3600000}
