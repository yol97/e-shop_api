name: CI Pipeline for Spring Boot

on:
  push:
    branches-ignore:
      - staging
      - production
      - development

  pull_request:
    branches:
      - development
      - staging
      - production

jobs:
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven

      - name: Run unit tests
        run: mvn -B -ntp -e -DtrimStackTrace=false test -Punit-tests

      - name: Print surefire reports
        if: always()
        run: |
          echo "===== SUREFIRE REPORTS (unit-tests) ====="
          ls -la target/surefire-reports || true
          echo "-----"
          for f in target/surefire-reports/*.txt; do
            echo "### $f"
            sed -n '1,260p' "$f" || true
            echo "-----"
          done

  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven


      - name: Check JWT env vars presence
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION_MS: ${{ secrets.JWT_EXPIRATION_MS }}
        run: |
          if [ -z "$JWT_SECRET" ]; then echo "JWT_SECRET is MISSING"; exit 1; else echo "JWT_SECRET is present"; fi
          if [ -z "$JWT_EXPIRATION_MS" ]; then echo "JWT_EXPIRATION_MS is MISSING"; exit 1; else echo "JWT_EXPIRATION_MS is present: $JWT_EXPIRATION_MS"; fi

      - name: Run integration tests
        run: mvn -B -ntp -e -DtrimStackTrace=false -Dspring.profiles.active=integration test -Pintegration-tests

      - name: Print surefire reports
        if: always()
        run: |
          echo "===== SUREFIRE REPORTS (integration-tests) ====="
          ls -la target/surefire-reports || true
          echo "-----"
          for f in target/surefire-reports/*.txt; do
            echo "### $f"
            sed -n '1,320p' "$f" || true
            echo "-----"
          done

  e2e-tests:
    name: 🚀 E2E Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && ((github.base_ref == 'staging' && github.head_ref == 'development') || (github.base_ref == 'production' && github.head_ref == 'staging'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Run E2E tests
        run: mvn -B -ntp -e -DtrimStackTrace=false test -Pe2e-tests

      - name: Print surefire reports
        if: always()
        run: |
          echo "===== SUREFIRE REPORTS (e2e-tests) ====="
          ls -la target/surefire-reports || true
          echo "-----"
          for f in target/surefire-reports/*.txt; do
            echo "### $f"
            sed -n '1,320p' "$f" || true
            echo "-----"
          done
